<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" fill="none">
  <!-- Outer Blue Ring -->
  <circle cx="150" cy="135" r="116" stroke="#1f3b7c" stroke-width="24" fill="#ffffff" />
  
  <!-- Inner Light Gray Background Circle -->
  <circle cx="150" cy="135" r="94" fill="#e7ebf3" />
  
  <!-- Stylized Letter 'A' Left & Right Stems -->
  <path d="M 150 42 L 78 194 L 114 194 L 150 108 L 186 194 L 222 194 Z" fill="#1f3b7c" />
  
  <!-- Red Accent Parallelogram on Bottom Right of 'A' -->
  <polygon points="196,166 222,198 198,198 172,166" fill="#d9251d" />
  
  <!-- Central White Shield Badge Over 'A' -->
  <g transform="rotate(-4 150 125)">
    <rect x="104" y="94" width="92" height="62" rx="14" fill="#ffffff" stroke="#1f3b7c" stroke-width="7" />
    <!-- Red Cross inside Central Shield -->
    <rect x="141" y="105" width="18" height="40" fill="#d9251d" rx="3" />
    <rect x="130" y="116" width="40" height="18" fill="#d9251d" rx="3" />
  </g>
  
  <!-- Bold ABHA Typography Below Logo Ring -->
  <text x="150" y="318" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="52" fill="#1f3b7c" text-anchor="middle" letter-spacing="3">ABHA</text>
</svg>
